# ESPHome LTC timecode node - optional "always online" edition (like a smart
# plug), for when convenience matters more than battery (~2x the current):
# stays on Wi-Fi, Home Assistant API, OTA, web UI, adoptable in the
# ESPHome dashboard. Timing = TSF of the access point it is connected to,
# so every node must be connected to the SAME access point (phone hotspot
# or a single router, no mesh).
# Hardware: Seeed XIAO ESP32C3, LTC on D3 -> attenuator -> camera input.

substitutions:
  # Identity
  name: "ltc-node-online"
  friendly_name: "LTC Node Online"
  device_description: "Wireless SMPTE LTC timecode generator"
  project_name: "esphome-ltc-sync.ltc-node-online"
  project_version: "v0.2.0"
  ltc_source: "github://sinnoken/esphome-ltc-sync@main"
  # Timecode
  fps: "25"                     # 24, 25, 29.97df, 30 (also selectable in HA)
  start_timecode: "00:00:00:00" # timecode at TSF 0 of the access point
  output_offset_us: "0"         # constant correction, see docs/verify.md
  output_level: mic             # mic (cameras) or line (recorders); saved per node
  resync_interval: "1min"
  # Hardware (Seeed XIAO ESP32C3)
  ltc_pin: GPIO5                # D3: mic-level tap (220k)
  line_pin: GPIO6               # D4: line-level tap (4.7k), see docs/hardware.md
  led_pin: GPIO4                # D2, "locked" LED via 330 ohm
  # Network
  wifi_power_save: light        # none = best timing (+~50 mA), light = longer battery life
  wifi_fast_connect: "false"
  timezone: ""                  # e.g. Asia/Taipei; empty = from Home Assistant / UTC
  # Logging
  log_level: DEBUG

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  name_add_mac_suffix: true
  min_version: 2026.10.0
  project:
    name: "${project_name}"
    version: "${project_version}"

esp32:
  board: seeed_xiao_esp32c3
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf

external_components:
  - source: ${ltc_source}
    components: [ltc_gen]

preferences:
  flash_write_interval: 5min

api:

ota:
  - platform: esphome

logger:
  level: ${log_level}

mdns:

web_server:
  port: 80
  version: 3

wifi:
  ap: {}
  fast_connect: ${wifi_fast_connect}
  power_save_mode: ${wifi_power_save}

captive_portal:

improv_serial:

dashboard_import:
  package_import_url: github://sinnoken/esphome-ltc-sync/ltc-node-online.yaml@main
  import_full_config: false

ltc_gen:
  id: ltc
  role: node
  source: wifi
  pin: ${ltc_pin}
  line_pin: ${line_pin}
  output_level: ${output_level}
  fps: "${fps}"
  start_timecode: "${start_timecode}"
  output_offset_us: ${output_offset_us}
  resync_interval: ${resync_interval}
  timecode:
    name: "Timecode"
  sync_state:
    name: "Sync State"
  locked:
    name: "Locked"
    on_press:
      - output.turn_on: lock_led
    on_release:
      - output.turn_off: lock_led
  ppm:
    name: "Clock Error"
  sync_error:
    name: "Sync Error"
  temperature:
    name: "Chip Temperature"

output:
  - platform: gpio
    pin: ${led_pin}
    id: lock_led

select:
  - platform: template
    name: "Output Level"          # per node, NOT synced (camera = mic, recorder = line)
    icon: mdi:volume-high
    options: ["mic", "line"]
    entity_category: config
    lambda: return id(ltc).get_output_level();
    update_interval: 5s
    set_action:
      - lambda: id(ltc).set_output_level(x);
  # Settings below are SYNCED: change them on any online node and every node
  # in the same sync_group follows (low-power nodes within one resync interval).
  - platform: template
    name: "Frame Rate"
    icon: mdi:filmstrip
    options: ["24", "25", "29.97df", "30"]
    lambda: return id(ltc).get_fps();
    update_interval: 2s
    set_action:
      - lambda: id(ltc).set_fps(x);

number:
  - platform: template
    name: "Resync Interval"
    icon: mdi:timer-sync-outline
    unit_of_measurement: min
    min_value: 0
    max_value: 60
    step: 1
    mode: box
    entity_category: config
    lambda: return id(ltc).get_resync_minutes();
    update_interval: 5s
    set_action:
      - lambda: id(ltc).set_resync_minutes(x);

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

button:
  - platform: template
    name: "Sync Now"
    icon: mdi:sync
    on_press:
      - lambda: id(ltc).sync_now();
  - platform: template
    name: "Jam Timecode"            # synced: all nodes restart at start_timecode
    icon: mdi:timer-refresh-outline
    on_press:
      - lambda: id(ltc).jam();
  - platform: template
    name: "Reset Synced Settings"   # back to the YAML defaults after restart
    entity_category: config
    on_press:
      - lambda: id(ltc).reset_settings();
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: config

sensor:
  - platform: template
    name: "Settings Revision"
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: return id(ltc).settings_rev();
    update_interval: 10s
  - platform: uptime
    name: "Uptime"
    type: timestamp
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
