# LTC master on your Wi-Fi: Home Assistant control and time of day via SNTP.
# The ESP-NOW channel is the router's channel, so fix the router to one
# 2.4 GHz channel and set the same `channel:` on every node.
substitutions:
  name: ltc-master

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Taipei

external_components:
  - source:
      type: local
      path: ../components

ltc_gen:
  id: ltc
  role: master
  pin: GPIO26
  fps: "25"
  time_id: sntp_time          # timecode = time of day
  timecode:
    name: "Master timecode"

select:
  - platform: template
    name: "Frame rate"
    options: ["24", "25", "29.97df", "30"]
    initial_option: "25"
    optimistic: true
    set_action:
      - lambda: id(ltc).set_fps(x);

button:
  - platform: template
    name: "Jam"
    on_press:
      - lambda: id(ltc).jam();
