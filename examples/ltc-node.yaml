# LTC node: one per camera (and one for the audio recorder).
# Seeed XIAO ESP32C3 + LiPo. No wifi component: the radio is only switched on
# for the short sync windows, in which the node passively listens to the
# beacons of a phone hotspot (it never connects to it).
substitutions:
  name: ltc-node-1

esphome:
  name: ${name}

esp32:
  board: seeed_xiao_esp32c3
  cpu_frequency: 80MHZ    # plenty for LTC, saves ~5-8 mA
  framework:
    type: esp-idf

logger:
  level: DEBUG   # sensor values are printed on the USB serial log (no wifi on nodes)

external_components:
  - source:
      type: local
      path: ../components
    # or, once pushed to GitHub:
    # source: github://<you>/esphome-ltc-sync

ltc_gen:
  id: ltc
  role: node
  pin: GPIO5              # XIAO D3: LTC out -> attenuator -> camera mic/line input
  # pps_pin: GPIO3        # XIAO D1: optional: 1 frame wide pulse every second, for scope checks
  source: hotspot         # time reference = your phone's hotspot beacons (no master needed)
  hotspot_ssid: "My iPhone"   # 2.4 GHz! iPhone: "Maximise Compatibility"
  # channel: 6            # optional: skip the scan if the hotspot channel is known
  fps: "25"               # every node must use the same fps
  initial_window: 12s     # first listen at boot
  window: 3s              # each later sync
  resync_interval: 10min  # 0s = calibrate at boot (+1, +5, +15 min) and then free-run
  temperature_compensation: true
  persist_temperature_model: true
  output_offset_us: 0
  # Entities are only visible on the serial log here (no wifi), but the
  # locked binary sensor can drive an LED, see below.
  locked:
    name: "${name} locked"
    on_press:
      - output.turn_on: lock_led
    on_release:
      - output.turn_off: lock_led
  timecode:
    name: "${name} timecode"
  sync_state:
    name: "${name} sync state"
  ppm:
    name: "${name} ppm"
  sync_error:
    name: "${name} sync error"
  temperature:
    name: "${name} temperature"

# Optional status LED on XIAO D2 / GPIO4 (on = locked)
output:
  - platform: gpio
    pin: GPIO4
    id: lock_led
