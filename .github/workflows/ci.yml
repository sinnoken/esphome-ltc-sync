name: CI
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: cd test && make libltc && make test
  esphome:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: [ltc-node.yaml, ltc-node-online.yaml, ltc-node-espnow.yaml, ltc-master.yaml, ltc-master-wifi.yaml, hotspot-keeper.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install esphome
      - run: |
          cp examples/secrets.example.yaml examples/secrets.yaml
          case "${{ matrix.file }}" in
            ltc-node*.yaml) esphome -s ltc_source components compile ${{ matrix.file }} ;;
            *) cd examples && esphome compile ${{ matrix.file }} ;;
          esac
